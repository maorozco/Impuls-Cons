kind = "web"
  previewPath = "/"
  title = "Impulso BioCycle Landing"
  version = "1.0.0"
  id = "lndBioCycle9wT4uXkAbc1"

  [[services]]
  localPort = 3000
  name = "Landing"
  paths = ["/"]

  [services.env]
  PORT = "3000"

  [services.development]
  run = "pnpm --filter @workspace/landing run dev"

  [services.production]

  [services.production.build]
  args = ["pnpm", "--filter", "@workspace/landing", "run", "build"]

  [services.production.run]
  args = ["pnpm", "--filter", "@workspace/landing", "run", "start"]

  [services.production.run.env]
  PORT = "3000"
  NODE_ENV = "production"
  